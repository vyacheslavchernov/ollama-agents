tool:
  alias: "fetch_page"
  name: "Web Page Fetcher"
  description: "Загрузить веб-страницу по URL и извлечь основной текст. Удаляет скрипты, стили и мусор, возвращает 
  заголовок и контент с возможностью обрезки по количеству символов. Начинай с небольшого количества символов в 
  контенте(3000), если нужно получить полную информацию с страницы, то увеличь это количество."
  parameters:
    - parameter:
        name: "url"
        type: "string"
        description: "URL страницы для загрузки. Должен быть корректным и доступным адресом."
    - parameter:
        name: "maxChars"
        type: "integer"
        description: "Максимальное количество символов в возвращаемом контенте. Контент будет обрезан, если превысит это значение."
  method: "ru.vych.tools.WebTools#fetchPage"