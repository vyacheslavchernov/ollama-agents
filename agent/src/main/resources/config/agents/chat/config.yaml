# Конфигурация минимального чат-бот агента
agent:
  # Имя агента
  name: "Minimal agent"

  # Описание функций агента
  description: "Agent with minimal config. Ready for conversation"

  # Модель, которая должна использоваться агентом
  model: "qwen3:8b"

  # Путь до системного промпта в папке ресурсов проекта
  system_prompt: "config/agents/chat/system_prompt.md"

  # Набор инструментов, который доступен агенту
  toolset: [
    "system_info"
  ]
